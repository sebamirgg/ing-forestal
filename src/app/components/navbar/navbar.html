<header
  [class]="scrolled()
    ? 'fixed top-0 left-0 right-0 z-50 bg-hueso/95 backdrop-blur-sm border-b border-tierra/15 transition-all duration-300'
    : 'fixed top-0 left-0 right-0 z-50 bg-transparent transition-all duration-300'"
  role="banner"
>
  <nav class="max-w-6xl mx-auto px-6 lg:px-10 h-16 flex items-center justify-between" aria-label="Navegación principal">
    <!-- Logo / Nombre -->
    <a href="#inicio" class="font-serif text-xl font-semibold text-bosque hover:text-bosque/80 transition-colors" aria-label="Ir al inicio">
      {{ config.shortName }}
    </a>

    <!-- Links desktop -->
    <ul class="hidden md:flex items-center gap-8" role="list">
      @for (link of navLinks; track link.href) {
        <li>
          <a
            [href]="link.href"
            class="font-sans text-sm font-medium text-piedra hover:text-bosque transition-colors relative
                   after:absolute after:bottom-0 after:left-0 after:h-px after:w-0 after:bg-tierra
                   after:transition-all after:duration-300 hover:after:w-full"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <!-- CTA desktop -->
    <div class="hidden md:flex items-center gap-4">
      <a
        [href]="'https://api.whatsapp.com/send/?phone=%2B56964945093&text&type=phone_number&app_absent=0'"
        target="_blank"
        rel="noopener noreferrer"
        class="font-sans text-sm font-medium bg-[#25D366] text-white px-4 py-2 rounded-md
               hover:bg-[#20bb5a] transition-colors flex items-center gap-2"
        aria-label="Contactar por WhatsApp"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
        </svg>
        Contáctame
      </a>
    </div>

    <!-- Botón hamburguesa (mobile) -->
    <button
      (click)="toggleMobile()"
      class="md:hidden text-carbon hover:text-bosque transition-colors p-1"
      [attr.aria-expanded]="mobileOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
    >
      @if (mobileOpen()) {
        <lucide-icon [img]="closeIcon" [size]="24" />
      } @else {
        <lucide-icon [img]="menuIcon" [size]="24" />
      }
    </button>
  </nav>

  <!-- Menú mobile -->
  @if (mobileOpen()) {
    <div
      id="mobile-menu"
      class="md:hidden bg-hueso border-t border-tierra/15 px-6 py-6 flex flex-col gap-5"
      role="navigation"
      aria-label="Menú mobile"
    >
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          (click)="closeMenu()"
          class="font-sans text-base font-medium text-piedra hover:text-bosque transition-colors py-1"
        >
          {{ link.label }}
        </a>
      }
      <a
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        (click)="closeMenu()"
        class="font-sans text-sm font-medium bg-[#25D366] text-white px-4 py-3 rounded-md
               hover:bg-[#20bb5a] transition-colors text-center mt-2 flex items-center justify-center gap-2"
        aria-label="Contactar por WhatsApp"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
        </svg>
        Contáctame
      </a>
    </div>
  }
</header>
