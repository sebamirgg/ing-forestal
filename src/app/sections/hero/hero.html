<section id="inicio" class="min-h-screen bg-hueso flex items-center pt-16" aria-label="Presentación">
  <div class="max-w-6xl mx-auto w-full px-6 lg:px-10 py-20 lg:py-28">
    <div class="grid lg:grid-cols-2 gap-14 lg:gap-20 items-center">

      <!-- Columna izquierda: Texto -->
      <div class="flex flex-col gap-6">
        <div appReveal class="flex items-center gap-3">
          <span class="h-px w-8 bg-tierra"></span>
          <span class="font-sans text-xs font-semibold text-tierra uppercase tracking-widest">Ingeniero Forestal · Chile</span>
        </div>

        <h1 appReveal revealDelay="reveal-delay-1" class="font-serif text-5xl lg:text-6xl xl:text-7xl font-bold text-carbon leading-[1.08]">
          {{ config.name }}
          <br>
          <span class="text-bosque">Ingeniero</span>
          <br>
          Forestal
        </h1>

        <p appReveal revealDelay="reveal-delay-2" class="font-sans text-piedra text-lg lg:text-xl leading-relaxed max-w-md">
          {{ config.hero.subtitle }}
        </p>

        <!-- CTAs -->
        <div appReveal revealDelay="reveal-delay-2" class="flex flex-wrap gap-3 pt-2">
          <a
            href="#servicios"
            class="font-sans font-medium text-sm bg-bosque text-hueso px-6 py-3 rounded-md
                   hover:bg-bosque/90 transition-colors inline-flex items-center gap-2"
            aria-label="Ver servicios ofrecidos"
          >
            Ver CUYIS
          </a>
          <a
            [href]="'https://api.whatsapp.com/send/?phone=%2B56964945093&text&type=phone_number&app_absent=0'"
            target="_blank"
            rel="noopener noreferrer"
            class="font-sans font-medium text-sm border-2 border-bosque text-bosque px-6 py-3 rounded-md
                   hover:bg-bosque hover:text-hueso transition-colors"
            aria-label="Contactar por WhatsApp"
          >
            Contáctame
          </a>
        </div>
      </div>

      <!-- Columna derecha: Foto placeholder -->
      <div appReveal revealDelay="reveal-delay-1" class="flex justify-center lg:justify-end">
        <div class="relative">
          <!-- Foto placeholder -->
          <div
            class="w-72 h-96 lg:w-80 lg:h-[460px] bg-musgo rounded-lg flex flex-col items-center justify-center gap-4"
            role="img"
            aria-label="Foto del profesional — pendiente de reemplazar"
          >
            <img src="https://i.ibb.co/LX26J7fv/Captura-de-pantalla-2026-05-21-235922.png" alt="Foto del profesional" class="w-full h-full object-cover rounded-lg" />
          </div>

          <!-- Elementos decorativos -->
          <div class="absolute -bottom-4 -left-4 w-28 h-28 border border-tierra/30 rounded-lg -z-10" aria-hidden="true"></div>
          <div class="absolute -top-4 -right-4 w-16 h-16 bg-arcilla/12 rounded-lg -z-10" aria-hidden="true"></div>
        </div>
      </div>

    </div>
  </div>
</section>
