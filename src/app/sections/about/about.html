<section id="sobre-mi" class="bg-niebla py-24 lg:py-32 px-6" aria-labelledby="about-title">
  <div class="max-w-6xl mx-auto">

    <!-- Header de sección -->
    <div appReveal class="flex items-center gap-3 mb-14">
      <span class="h-px w-8 bg-tierra"></span>
      <span class="font-sans text-xs font-semibold text-tierra uppercase tracking-widest">Sobre mí</span>
    </div>

    <div class="grid lg:grid-cols-5 gap-14 lg:gap-20 items-start">

      <!-- Foto placeholder -->
      <div appReveal class="lg:col-span-2 flex justify-center lg:justify-start">
        <div class="relative">
          <div
            class="w-64 h-80 lg:w-full lg:h-96 bg-musgo/70 rounded-lg flex flex-col items-center justify-center gap-3"
            role="img"
            aria-label="Foto del profesional — pendiente de reemplazar"
          >
            <img src="https://i.ibb.co/ymCgrXTK/Captura-de-pantalla-2026-05-22-000502.png" alt="Foto del profesional" class="w-full h-full object-cover rounded-lg" />

          </div>
          <div class="absolute -bottom-3 -right-3 w-20 h-20 border border-tierra/30 rounded -z-10" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Texto -->
      <div class="lg:col-span-3 flex flex-col gap-6">
        <h2 appReveal id="about-title" class="font-serif text-4xl lg:text-5xl font-bold text-carbon leading-tight">
          El bosque como<br>punto de partida
        </h2>

        <div appReveal revealDelay="reveal-delay-1" class="flex flex-col gap-5">
          @for (paragraph of config.about.bio; track $index) {
            <p class="font-sans text-piedra leading-relaxed">{{ paragraph }}</p>
          }
        </div>

        <!-- Línea divisoria -->
        <div class="h-px bg-tierra/20 my-2"></div>

        <!-- Mini-stats -->
        <div appReveal revealDelay="reveal-delay-2" class="grid grid-cols-3 gap-6">
          @for (stat of config.about.stats; track stat.label) {
            <div class="flex flex-col gap-1">
              <span class="font-serif text-3xl lg:text-4xl font-bold text-bosque">{{ stat.value }}</span>
              <span class="font-sans text-xs text-piedra leading-snug">{{ stat.label }}</span>
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</section>
